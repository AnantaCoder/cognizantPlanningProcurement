services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI + PuLP + Scikit-Learn)
  # ============================================================================
  - type: web
    name: trendwear-sop-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"

  # ============================================================================
  # 2. Frontend Static Site (React + Vite + Tailwind)
  # ============================================================================
  - type: static
    name: trendwear-sop-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: trendwear-sop-backend
          property: host

